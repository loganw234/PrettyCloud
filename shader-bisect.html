<script>
/* Compile a vertex shader containing only the selected plates (by index),
   with a dispatcher over just those. Times compile+link via ubershader-style
   forced completion (getProgramParameter blocks until FXC finishes). */
window.__results = [];
window.__done = false;

function buildShaderFor(indices) {
  const plates = indices.map(i => Atlas.plates[i]);
  const shapes = plates.map(p => p.glsl).join("\n");
  const dispatch = plates
    .map((p, k) => `  if(m == ${k}) return shape_${p.id}(q, rnd, seed, P, col);`)
    .join("\n");
  return (
    Atlas.GLSL.vertHeader +
    "\n" + shapes + "\n" +
    "vec3 shape(int m, vec2 q, vec4 rnd, uint seed, float P[8], out vec3 col){\n" +
    dispatch + "\n" +
    "  col = vec3(0.0); return vec3(0.0);\n}\n" +
    Atlas.GLSL.vertMain
  );
}

function timeCompile(gl, vsSrc) {
  const t0 = performance.now();
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, vsSrc);
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
    return { ok: false, ms: performance.now() - t0, log: gl.getShaderInfoLog(vs).slice(0, 500) };
  }
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, Atlas.GLSL.pointFrag);
  gl.compileShader(fs);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  const linked = gl.getProgramParameter(p, gl.LINK_STATUS); /* forces the wait */
  const ms = performance.now() - t0;
  gl.deleteProgram(p); gl.deleteShader(vs); gl.deleteShader(fs);
  return { ok: !!linked, ms };
}

async function run() {
  const gl = document.getElementById("gl").getContext("webgl2");
  if (!gl) { window.__results.push({ name: "NO WEBGL2", ok: false }); window.__done = true; return; }
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  window.__renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "unknown";

  const qs = new URLSearchParams(location.search);
  const mode = qs.get("mode") || "singles";
  const jobs = [];
  if (mode === "singles") {
    /* each new plate alone (plus hopf so the dispatcher is non-trivial) */
    for (let i = 48; i < 56; i++) jobs.push({ name: Atlas.plates[i].id, idx: [0, i] });
  } else if (mode === "base48") {
    jobs.push({ name: "base48", idx: Array.from({ length: 48 }, (_, i) => i) });
  } else if (mode === "full56") {
    jobs.push({ name: "full56", idx: Array.from({ length: 56 }, (_, i) => i) });
  } else if (mode === "growth") {
    for (const n of [8, 16, 24, 32, 40, 48, 52, 54, 56])
      jobs.push({ name: "1.." + n, idx: Array.from({ length: n }, (_, i) => i) });
  } else if (mode.startsWith("prefix")) {
    const n = parseInt(mode.slice(6), 10);
    jobs.push({ name: "1.." + n, idx: Array.from({ length: n }, (_, i) => i) });
  }
  for (const j of jobs) {
    const r = timeCompile(gl, buildShaderFor(j.idx));
    window.__results.push({ name: j.name, ok: r.ok, ms: Math.round(r.ms), log: r.log });
    await new Promise(res => setTimeout(res, 50));
  }
  window.__done = true;
}
run();
</script>
